[project]
name = "crypto-oracle"
version = "0.1.0"
description = "Reproducible crypto forecasting and prospective news experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "feedparser>=6.0,<7", "numpy>=1.26,<3", "timesfm[torch]==2.0.2",
  "transformers>=4.51,<5", "torch>=2.6,<3", "python-dotenv>=1,<2",
  "laya==0.3.20",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
crypto-oracle = "oracle.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["oracle"]

[tool.uv.sources]
torch = [{index = "pytorch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
